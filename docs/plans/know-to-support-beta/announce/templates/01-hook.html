<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>告知素材 1/3 — 引っかかり</title>
    <style>
      :root {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --border: oklch(0.269 0 0);
        --secondary: oklch(0.269 0 0);
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Sans",
          "Hiragino Kaku Gothic ProN",
          "Noto Sans JP",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .canvas {
        box-sizing: border-box;
        width: 1080px;
        height: 1920px;
        padding: 260px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      [contenteditable] {
        outline: none;
      }
      .photo {
        width: 320px;
        height: 320px;
        border-radius: 50%;
        border: 4px solid var(--border);
        background: var(--secondary);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-foreground);
        font-size: 28px;
        text-align: center;
        line-height: 1.5;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hook {
        margin: 0;
        font-size: 92px;
        font-weight: 800;
        line-height: 1.25;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }
      .name {
        margin: 56px 0 0;
        font-size: 64px;
        font-weight: 700;
        line-height: 1.2;
      }
      .genre {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 28px;
        border: 3px solid var(--border);
        border-radius: 999px;
        font-size: 32px;
        color: var(--muted-foreground);
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        color: var(--muted-foreground);
        font-size: 32px;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="photo">
        <span contenteditable="true">写真を入れる<br />（任意）</span>
      </div>

      <div>
        <p class="hook" contenteditable="true">
          【引っかかりの一文：技の名前ではなく、誰にでも分かる一文】
        </p>
        <p class="name" contenteditable="true">【名前】</p>
        <span class="genre" contenteditable="true">【ジャンル】</span>
      </div>

      <div class="foot">
        <span class="brand">beatfolio</span>
        <span>1 / 3 →</span>
      </div>
    </div>
  </body>
</html>
