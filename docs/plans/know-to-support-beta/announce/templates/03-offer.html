<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>告知素材 3/3 — オファーと URL / QR</title>
    <style>
      :root {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --primary: oklch(0.985 0 0);
        --primary-foreground: oklch(0.205 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --border: oklch(0.269 0 0);
        --secondary: oklch(0.269 0 0);
        --radius: 0.625rem;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Sans",
          "Hiragino Kaku Gothic ProN",
          "Noto Sans JP",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .canvas {
        box-sizing: border-box;
        width: 1080px;
        height: 1920px;
        padding: 260px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      [contenteditable] {
        outline: none;
      }
      .when {
        margin: 0;
        font-size: 84px;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .where {
        margin: 24px 0 0;
        font-size: 48px;
        line-height: 1.4;
        color: var(--muted-foreground);
      }
      .comment {
        margin: 56px 0 0;
        font-size: 44px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .cta {
        display: flex;
        align-items: center;
        gap: 40px;
      }
      .qr {
        flex: none;
        width: 360px;
        height: 360px;
        box-sizing: border-box;
        border: 4px dashed var(--border);
        border-radius: var(--radius);
        background: var(--secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--muted-foreground);
        font-size: 28px;
        line-height: 1.5;
        overflow: hidden;
      }
      .qr img {
        width: 100%;
        height: 100%;
      }
      .cta-text {
        min-width: 0;
      }
      .button {
        display: inline-block;
        padding: 20px 40px;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-foreground);
        font-size: 40px;
        font-weight: 700;
      }
      .url {
        margin: 28px 0 0;
        font-size: 30px;
        line-height: 1.4;
        color: var(--muted-foreground);
        overflow-wrap: anywhere;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        color: var(--muted-foreground);
        font-size: 32px;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div>
        <p class="when" contenteditable="true">【日付】</p>
        <p class="where" contenteditable="true">【場所】</p>
        <p class="comment" contenteditable="true">
          【オファーの一言：なぜ来てほしいか。一文】
        </p>
      </div>

      <div class="cta">
        <div class="qr">
          <span>QR をここに貼る<br />（360×360）</span>
        </div>
        <div class="cta-text">
          <span class="button" contenteditable="true">続きはページで</span>
          <p class="url" contenteditable="true">
            https://【host】/players/【handle】?from=announce
          </p>
        </div>
      </div>

      <div class="foot">
        <span class="brand">beatfolio</span>
        <span>3 / 3</span>
      </div>
    </div>
  </body>
</html>
