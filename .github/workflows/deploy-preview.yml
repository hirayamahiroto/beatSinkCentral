name: "🚀 プレビュー環境へデプロイ"

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.1"
  GIT_BRANCH: ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  # ビルドとテスト
  test-api-server:
    if: github.event.action != 'closed'
    name: 🧪 test-api-server
    runs-on: ubuntu-latest
    steps:
      - name: 📥 コードのチェックアウト
        uses: actions/checkout@v4

      - name: 🏗️ ビルド＆テスト
        uses: ./.github/actions/build-and-test
        with:
          package-filter: api-server
          node-version: ${{ env.NODE_VERSION }}

  test-beatfolio:
    if: github.event.action != 'closed'
    name: 🧪 test-beatfolio
    runs-on: ubuntu-latest
    steps:
      - name: 📥 コードのチェックアウト
        uses: actions/checkout@v4

      - name: 🏗️ ビルド＆テスト
        uses: ./.github/actions/build-and-test
        with:
          package-filter: beatfolio
          node-version: ${{ env.NODE_VERSION }}

  db-migrate:
    if: github.event.action != 'closed'
    name: 🗄️ db-migrate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 コードのチェックアウト
        uses: actions/checkout@v4

      - name: 📦 依存関係のインストール
        uses: ./.github/actions/install-dependencies
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🗄️ マイグレーション実行
        run: npm run db:migrate -w database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

      - name: 🌱 シードデータ投入
        run: npm run db:seed -w database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

  # APIサーバーのデプロイ（テスト・マイグレーション完了後に実行）
  deploy-api-server:
    name: 🔮 deploy-api-server
    runs-on: ubuntu-latest
    needs: [test-api-server, db-migrate]  # テストとマイグレーション完了後に実行
    outputs:
      api-url: ${{ steps.deploy.outputs.url }}
      api-inspect-url: ${{ steps.deploy.outputs.inspect-url }}
    steps:
      - name: 📥 コードのチェックアウト
        uses: actions/checkout@v4

      - name: 📦 依存関係のインストール
        uses: ./.github/actions/install-dependencies
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔧 Vercel CLIのインストール
        run: npm install --global vercel@latest

      - name: 🌐 APIサーバー環境情報の取得
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_SERVER_PROJECT_ID }}

      - name: 🔍 APIサーバー環境変数の設定
        run: |
          vercel env rm DEBUG_URL preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_SERVER_PROJECT_ID }}

      - name: 🏗️ APIサーバービルド
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_SERVER_PROJECT_ID }}

      - name: 🚀 APIサーバーデプロイ
        id: deploy
        run: |
          OUTPUT=$(vercel deploy --prebuilt \
            --meta gitBranch=${{ env.GIT_BRANCH }} \
            --token=${{ secrets.VERCEL_TOKEN }} 2> deploy.log)
          INSPECT_URL=$(grep -o 'https://vercel.com/[^ ]*' deploy.log | head -n 1)
          echo "url=$OUTPUT" >> $GITHUB_OUTPUT
          echo "inspect-url=$INSPECT_URL" >> $GITHUB_OUTPUT
          echo "APIサーバーURL: $OUTPUT"
          echo "Inspect: $INSPECT_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_SERVER_PROJECT_ID }}

  # Beatfolioのデプロイ（APIサーバーのデプロイ完了後に実行）
  deploy-beatfolio:
    name: 🔮 deploy-beatfolio
    runs-on: ubuntu-latest
    needs: [test-beatfolio, deploy-api-server]  # テストとAPIサーバーのデプロイが完了してから実行
    outputs:
      beatfolio-url: ${{ steps.deploy.outputs.url }}
      beatfolio-inspect-url: ${{ steps.deploy.outputs.inspect-url }}
    steps:
      - name: 📥 コードのチェックアウト
        uses: actions/checkout@v4

      - name: 📦 依存関係のインストール
        uses: ./.github/actions/install-dependencies
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔧 Vercel CLIのインストール
        run: npm install --global vercel@latest

      - name: 🌐 Beatfolio環境情報の取得
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BEATFOLIO_PROJECT_ID }}

      - name: 🏗️ Beatfolioビルド
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BEATFOLIO_PROJECT_ID }}

      - name: 🚀 Beatfolioデプロイ
        id: deploy
        run: |
          OUTPUT=$(vercel deploy --prebuilt \
            -e API_SERVER_BASE_URL=${{ needs.deploy-api-server.outputs.api-url }} \
            --meta gitBranch=${{ env.GIT_BRANCH }} \
            --token=${{ secrets.VERCEL_TOKEN }} 2> deploy.log)
          INSPECT_URL=$(grep -o 'https://vercel.com/[^ ]*' deploy.log | head -n 1)
          echo "url=$OUTPUT" >> $GITHUB_OUTPUT
          echo "inspect-url=$INSPECT_URL" >> $GITHUB_OUTPUT
          echo "BeatfolioURL: $OUTPUT (API_SERVER_BASE_URL=${{ needs.deploy-api-server.outputs.api-url }})"
          echo "Inspect: $INSPECT_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BEATFOLIO_PROJECT_ID }}

  comment:
    name: 💬 comment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [deploy-api-server, deploy-beatfolio]
    steps:
      - name: 💬 プレビュー環境情報をPRコメントへ出力
        uses: actions/github-script@v7
        env:
          API_URL: ${{ needs.deploy-api-server.outputs.api-url }}
          API_INSPECT_URL: ${{ needs.deploy-api-server.outputs.api-inspect-url }}
          BEATFOLIO_URL: ${{ needs.deploy-beatfolio.outputs.beatfolio-url }}
          BEATFOLIO_INSPECT_URL: ${{ needs.deploy-beatfolio.outputs.beatfolio-inspect-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- preview-deploy-info -->";
            const body = [
              marker,
              "## 🔮 プレビュー環境",
              "",
              "| アプリ | プレビュー URL | Vercel ダッシュボード |",
              "| --- | --- | --- |",
              `| beatfolio | ${process.env.BEATFOLIO_URL} | [Inspect](${process.env.BEATFOLIO_INSPECT_URL}) |`,
              `| api-server | ${process.env.API_URL} | [Inspect](${process.env.API_INSPECT_URL}) |`,
              "",
              `commit: ${process.env.SHA}`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup-preview:
    name: 🧹 cleanup-preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    strategy:
      matrix:
        include:
          - app: api-server
            project-id-secret: VERCEL_API_SERVER_PROJECT_ID
          - app: beatfolio
            project-id-secret: VERCEL_BEATFOLIO_PROJECT_ID
    steps:
      - name: 🔧 Vercel CLIのインストール
        run: npm install --global vercel@latest

      - name: 🧹 ${{ matrix.app }} のプレビューデプロイを削除
        run: |
          for _ in $(seq 1 10); do
            URLS=$(vercel ls --meta gitBranch=${{ env.GIT_BRANCH }} --token=${{ secrets.VERCEL_TOKEN }} 2>&1 \
              | grep -oE 'https://[^ ]+\.vercel\.app' | sort -u || true)
            [ -z "$URLS" ] && break
            echo "$URLS" | xargs -n1 vercel rm --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          done
          echo "gitBranch=${{ env.GIT_BRANCH }} のプレビューデプロイを削除しました"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project-id-secret] }}
